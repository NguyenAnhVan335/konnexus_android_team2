plugins {
    id "com.android.application"
    id "kotlin-android"
    // Plugin Flutter phải được apply sau Android và Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.konnexus.app"
    compileSdk = flutter.compileSdkVersion
    // NDK chỉ dùng khi build; xem ghi chú trong README nếu máy chưa có NDK 28.2.
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.konnexus.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Bản demo dùng chung signing debug; cấu hình release thật khi phát hành.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
