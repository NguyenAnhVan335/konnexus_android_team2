$kind: http-request
url: "{{baseUrl}}/api/groups/{{privateGroupId}}/posts/pending"
method: GET
headers:
  X-Test-User-Id: "{{ownerA}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Danh sách chứa ID vừa tạo", function () { pm.expect(json.data.map(x => x.id)).to.include(pm.collectionVariables.get("privatePostId")); });
    language: text/javascript
order: 4000
