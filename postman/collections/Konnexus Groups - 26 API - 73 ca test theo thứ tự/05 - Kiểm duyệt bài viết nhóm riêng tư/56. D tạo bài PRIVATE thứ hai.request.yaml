$kind: http-request
url: "{{baseUrl}}/api/groups/{{privateGroupId}}/posts"
method: POST
headers:
  X-Test-User-Id: "{{outsiderD}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "Bài PRIVATE để kiểm thử xóa mềm {{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Đang chờ", function () { pm.expect(json.data.status).to.eql("PENDING"); });
      if (pm.response.code === 201 && json.data) { pm.collectionVariables.set("privatePost2Id", json.data.id); }
    language: text/javascript
order: 9000
