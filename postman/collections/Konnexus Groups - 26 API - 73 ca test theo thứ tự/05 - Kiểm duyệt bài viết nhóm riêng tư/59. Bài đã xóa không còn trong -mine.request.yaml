$kind: http-request
name: 59. Bài đã xóa không còn trong /mine
url: "{{baseUrl}}/api/groups/{{privateGroupId}}/posts/mine"
method: GET
headers:
  X-Test-User-Id: "{{outsiderD}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Danh sách không còn chứa ID đã xóa", function () { pm.expect(json.data.map(x => x.id)).not.to.include(pm.collectionVariables.get("privatePost2Id")); });
    language: text/javascript
order: 12000
