$kind: http-request
url: "{{baseUrl}}/api/groups/{{privateGroupId}}/posts/{{privatePostId}}/approve"
method: PUT
headers:
  X-Test-User-Id: "{{ownerA}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Trạng thái PUBLISHED", function () { pm.expect(json.data.status).to.eql("PUBLISHED"); });
    language: text/javascript
order: 5000
