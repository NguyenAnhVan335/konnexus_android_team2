$kind: http-request
url: "{{baseUrl}}/api/groups/{{privateGroupId}}/posts/{{privatePostId}}"
method: PUT
headers:
  X-Test-User-Id: "{{outsiderD}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "Bài PRIVATE sửa lại cần duyệt lần nữa {{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("PENDING sau khi sửa", function () { pm.expect(json.data.status).to.eql("PENDING"); });
    language: text/javascript
order: 7000
