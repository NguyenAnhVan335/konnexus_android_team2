$kind: http-request
url: "{{baseUrl}}/api/groups/{{publicGroupId}}/posts/{{publicPostId}}"
method: PUT
headers:
  X-Test-User-Id: "{{memberB}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "Nội dung bài PUBLIC đã sửa {{runId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Bài vẫn PUBLISHED", function () { pm.expect(json.data.status).to.eql("PUBLISHED"); });
      pm.test("Nội dung mới", function () { pm.expect(json.data.content).to.include("đã sửa"); });
    language: text/javascript
order: 3000
