$kind: http-request
name: "46. Sau xóa: danh sách không còn bài"
url: "{{baseUrl}}/api/groups/{{publicGroupId}}/posts"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Danh sách không còn chứa ID đã xóa", function () { pm.expect(json.data.map(x => x.id)).not.to.include(pm.collectionVariables.get("publicPostId")); });
    language: text/javascript
order: 7000
