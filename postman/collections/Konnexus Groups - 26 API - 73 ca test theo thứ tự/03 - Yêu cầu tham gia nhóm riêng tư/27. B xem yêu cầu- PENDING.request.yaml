$kind: http-request
name: "27. B xem yêu cầu: PENDING"
url: "{{baseUrl}}/api/groups/{{privateGroupId}}/membership"
method: GET
headers:
  X-Test-User-Id: "{{memberB}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Trạng thái PENDING", function () { pm.expect(json.data.status).to.eql("PENDING"); });
    language: text/javascript
order: 3000
