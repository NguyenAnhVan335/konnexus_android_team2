$kind: http-request
url: "{{baseUrl}}/api/groups/{{privateGroupId}}/requests"
method: GET
headers:
  X-Test-User-Id: "{{ownerA}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Có yêu cầu D", function () { pm.expect(json.data.some(x=>x.userId === pm.collectionVariables.get("outsiderD"))).to.be.true; });
      if (pm.response.code === 200 && json.data) { pm.collectionVariables.set("requestDId", json.data.find(x=>x.userId === pm.collectionVariables.get("outsiderD")).id); }
    language: text/javascript
order: 11000
