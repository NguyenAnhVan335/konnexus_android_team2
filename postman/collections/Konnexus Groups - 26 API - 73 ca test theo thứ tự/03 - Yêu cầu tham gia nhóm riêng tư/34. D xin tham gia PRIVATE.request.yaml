$kind: http-request
url: "{{baseUrl}}/api/groups/{{privateGroupId}}/join"
method: POST
headers:
  X-Test-User-Id: "{{outsiderD}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("D đang chờ", function () { pm.expect(json.data.status).to.eql("PENDING"); });
    language: text/javascript
order: 10000
