$kind: http-request
url: "{{baseUrl}}/api/groups/{{publicGroupId}}/membership"
method: GET
headers:
  X-Test-User-Id: "{{memberB}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Có quyền thành viên", function () { pm.expect(json.data.status).to.eql("MEMBER"); });
      pm.test("Role MEMBER", function () { pm.expect(json.data.role).to.eql("MEMBER"); });
    language: text/javascript
order: 4000
