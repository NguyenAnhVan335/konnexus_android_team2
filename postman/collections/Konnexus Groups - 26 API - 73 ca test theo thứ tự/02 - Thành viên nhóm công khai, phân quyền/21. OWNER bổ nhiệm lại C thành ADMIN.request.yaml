$kind: http-request
url: "{{baseUrl}}/api/groups/{{publicGroupId}}/members/{{memberC}}/promote"
method: PUT
headers:
  X-Test-User-Id: "{{ownerA}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("C là ADMIN", function () { pm.expect(json.data.role).to.eql("ADMIN"); });
    language: text/javascript
order: 10000
