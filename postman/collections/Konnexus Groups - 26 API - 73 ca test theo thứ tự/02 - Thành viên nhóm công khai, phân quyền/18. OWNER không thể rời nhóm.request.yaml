$kind: http-request
url: "{{baseUrl}}/api/groups/{{publicGroupId}}/members/me"
method: DELETE
headers:
  X-Test-User-Id: "{{ownerA}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 409", function () { pm.response.to.have.status(409); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = false", function () { pm.expect(json.success).to.eql(false); });
    language: text/javascript
order: 7000
