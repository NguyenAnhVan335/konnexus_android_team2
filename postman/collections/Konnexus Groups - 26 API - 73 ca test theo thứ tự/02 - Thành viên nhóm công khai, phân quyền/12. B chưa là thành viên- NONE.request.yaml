$kind: http-request
name: "12. B chưa là thành viên: NONE"
url: "{{baseUrl}}/api/groups/{{publicGroupId}}/membership"
method: GET
headers:
  X-Test-User-Id: "{{memberB}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Chưa tham gia", function () { pm.expect(json.data.status).to.eql("NONE"); });
    language: text/javascript
order: 1000
