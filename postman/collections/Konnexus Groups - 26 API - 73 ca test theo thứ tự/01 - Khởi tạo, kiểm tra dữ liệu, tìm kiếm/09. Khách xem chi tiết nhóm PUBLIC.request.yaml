$kind: http-request
url: "{{baseUrl}}/api/groups/{{publicGroupId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("id khớp biến", function () { pm.expect(json.data.id).to.eql(pm.collectionVariables.get("publicGroupId")); });
      pm.test("Khách không có vai trò", function () { pm.expect(json.data.myRole).to.be.null; });
    language: text/javascript
order: 9000
