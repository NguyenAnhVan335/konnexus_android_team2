$kind: http-request
url: "{{baseUrl}}/api/groups/{{publicGroupId}}"
method: PUT
headers:
  X-Test-User-Id: "{{ownerA}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Konnexus_PUBLIC_Updated_{{runId}}",
      "description": "Đã cập nhật nội dung",
      "privacy": "PUBLIC",
      "requirePostApproval": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("Tên cập nhật", function () { pm.expect(json.data.name).to.include("Updated"); });
    language: text/javascript
order: 10000
