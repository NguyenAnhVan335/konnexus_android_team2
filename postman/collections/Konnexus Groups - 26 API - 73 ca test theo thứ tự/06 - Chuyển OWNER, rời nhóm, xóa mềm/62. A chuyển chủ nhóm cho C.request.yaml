$kind: http-request
url: "{{baseUrl}}/api/groups/{{publicGroupId}}/owner/{{memberC}}"
method: PUT
headers:
  X-Test-User-Id: "{{ownerA}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      let json = {}; try { json = pm.response.json(); } catch(e) {}
      pm.test("success = true", function () { pm.expect(json.success).to.eql(true); });
      pm.test("OWNER mới là C", function () { pm.expect(json.data.ownerId).to.eql(pm.collectionVariables.get("memberC")); });
    language: text/javascript
order: 3000
