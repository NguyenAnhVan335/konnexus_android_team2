# Test-only datasource: in-memory H2 so Post tests run without an external PostgreSQL.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Giá trị giả cho các env var bắt buộc (không có trên môi trường test)
quarkus.langchain4j.openai.api-key=test-key
app.cloudinary.url=cloudinary://test:test@test
