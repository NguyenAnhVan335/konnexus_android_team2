# PostgreSQL / Neon
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}

app.cloudinary.url=${CLOUDINARY_URL}

//JWT config
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:jwt/privateKey.pem}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:konnexus-jwt}

#Hibernate
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET, PUT, POST, DELETE, OPTIONS
quarkus.http.cors.headers=Authorization, Content-Type

quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.api-key=${GROQ_API_KEY}
quarkus.langchain4j.openai.base-url=https://api.groq.com/openai/v1

quarkus.langchain4j.openai.chat-model.model-name=llama-3.3-70b-versatile